name: Publish reports to GitHub Pages

# The repository is public as of 2026-08-27, so the push trigger that was
# commented out while it was private (GitHub Pages on the free tier needs a
# public repo) is restored: every push to main that touches one of these
# paths deploys automatically. workflow_dispatch stays too, for a manual
# rebuild that doesn't require a matching file change.
on:
  push:
    branches: [main]
    paths:
      - 'output/v2_report.html'
      - 'output/narrative.html'
      - 'output/academic_paper.html'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Assemble the site from the canonical outputs -- the reports are never
      # duplicated in the repo, only copied at deploy time under shorter names.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp site/index.html               _site/index.html
          cp output/v2_report.html         _site/report.html
          cp output/narrative.html         _site/narrative.html
          cp output/academic_paper.html    _site/paper.html
          touch _site/.nojekyll
          ls -la _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
