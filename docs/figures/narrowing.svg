<text x="196.0" y="99.0" font-size="11" fill="#1f2933" text-anchor="end" font-weight="normal">Frozen P3</text>
<line x1="535.4" y1="95.0" x2="367.8" y2="95.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
