<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="700" height="240" role="img" aria-label="Narrowing in each model" font-family="Helvetica,Arial,sans-serif">
<rect width="700" height="240" fill="#ffffff"/>
