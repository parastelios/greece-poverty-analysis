<text x="310.0" y="193.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal">+0</text>
<line x1="393.3" y1="60.0" x2="393.3" y2="175.0" stroke="#e5e7eb" stroke-width="1"/>
